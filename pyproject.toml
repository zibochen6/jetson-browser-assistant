[project]
name = "jetson-browser"
version = "0.1.0"
description = "Local decision-model browser and whiteboard assistant for Jetson Orin NX"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.7.0",
  "laya==0.3.9",
  "transformers==4.57.6",
  "numpy>=1.26,<2",
  "playwright==1.64.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx==0.28.1",
  "rich>=13.9,<15",
  "pydantic>=2.10,<3",
]

[project.scripts]
jetson-browser = "jetson_browser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetson_browser"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.uv.sources]
torch = { path = "vendor/wheels/torch-2.7.0-cp310-cp310-linux_aarch64.whl" }

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
